name = "respeako-pronunciation"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Origins allowed to call the Worker from a browser (web app, local dev, Android app).
ALLOWED_ORIGINS = "https://respeako.relifes.net,http://localhost:5173,https://localhost"
# Monthly audio cap in seconds. 16200 = 4.5 hours, below the 5-hour Azure F0 free tier.
MONTHLY_LIMIT_SECONDS = "16200"
AZURE_SPEECH_REGION = "southeastasia"

# Secrets (never commit these). Set them with:
#   npx wrangler secret put AZURE_SPEECH_KEY
#   npx wrangler secret put APP_ACCESS_TOKEN

[[kv_namespaces]]
binding = "USAGE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
